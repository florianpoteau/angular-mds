
<main class="main">
  <div class="content">

    <h1 style="font-size: 40px;">Événements du campus 🎓</h1>
    <br />

    <div class="events-grid">

      @for (event of events; track event.id) {
        <article
          class="event-card"
          style="border-bottom: 1px solid black;"
          (click)="onclick(event.id)"
        >

          <span
            class="event-type"
            style="font-size: 30px; font-weight: bold; color: #007bff;"
          >
            {{ event.type }}
          </span>

          <h2>{{ event.title }}</h2>

          <p>{{ event.description }}</p>

          <div class="event-info">
            <p>{{ event.date | date:'dd/MM/yyyy à HH:mm' }}</p>
            <p>{{ event.location }}</p>

            @if (event.capacity) {
              <p>
                Capacité : {{ event.capacity }} personnes
              </p>
            } @else {
              <p>Capacité non défini</p>
            }
          </div>

          <br />

        </article>
      }

    </div>
  </div>
</main>
